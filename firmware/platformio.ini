; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Essential Libraries
lib_deps =
    miguelbalboa/MFRC522 @ ^1.4.10       ; RFID MFRC522
    adafruit/Adafruit Fingerprint Sensor Library @ ^2.2.0 ; Fingerprint Sensor
    knolleary/PubSubClient @ ^2.8        ; MQTT Client
    arduino-libraries/NTPClient @ ^3.2.1 ; NTP Time Client (alternative to configTime)
    arduino-libraries/CryptoAuthLib @ ^3.7.2 ; Microchip ATECC608A
    bblanchon/ArduinoJson @ ^6.19.4      ; JSON parsing

; Built-in libraries used: WiFi, WiFiClientSecure, Update (for OTA), ESPmDNS, FS, SPIFFS/LittleFS (for CA Certs)

; Secure Build Flags (Example - adjust based on testing)
build_flags =
    -Os                            ; Optimize for size (can use -O2 for speed)
    -Wall                          ; Enable all warnings
    -Wextra                        ; Enable extra warnings
    ; -fstack-protector-all        ; Enable stack smashing protector (check compatibility/overhead)
    ; -Wl,-z,relro,-z,now          ; Linker hardening (check compatibility)
    -DCORE_DEBUG_LEVEL=1           ; Reduce debug output for production (0=None, 5=Verbose)
    -DCONFIG_MBEDTLS_HARDWARE_AES=y ; Ensure hardware AES is enabled in underlying SDK config
    -DCONFIG_MBEDTLS_HARDWARE_SHA=y ; Ensure hardware SHA is enabled
    -DARDUINO_LOOP_STACK_SIZE=16384 ; Increase loop stack size if needed

; Upload Filesystem image for certificates, keys etc.
; board_build.filesystem = littlefs ; or spiffs
; upload_speed = 921600

; Optional: For ATECC608A I2C configuration
; build_flags =
;    -DATCA_HAL_I2C              ; Use I2C HAL
;    -DARDUINO_ARCH_ESP32        ; Specify ESP32 arch for CryptoAuthLib HAL
;    -DATCA_PRINTF               ; Enable debug prints from CryptoAuthLib (remove for prod)

; Monitor Filters for cleaner output
; monitor_filters = esp32_exception_decoder, default

[platformio]
description = Secure IoT Lock System using ESP32, Biometrics, RFID, ATECC608A, AES-256, TLS, TOTP